<!doctype html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Library</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    </head>

    <body>
        <nav class="navbar navbar-expand-lg bg-body-tertiary ">
            <div class="container-fluid">
                <a class="navbar-brand" href="/home/"><b>Welcome To Library</b></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="/home/">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="/add-book/">Add Book</a>
                        </li>
                    </ul>
                </div>
                <div class="me-3" style="display:flex; gap: 10px;">
                    <button class="btn btn-dark"> {{ user }} </button>
                    <a href="/logout/" class="btn btn-danger">Logout</a>
                </div>
            </div>
        </nav>

        <div class="container-fluid mt-5">

            <div class="row">
                <div class="col-md-6  ms-5">
                    <h3>All Books</h3>
                    <table class="table" style="width: 50vw;">
                        <thead>
                            <tr>
                                <th scope="col">Index</th>
                                <th scope="col">Title</th>
                                <th scope="col">Type</th>
                                <th scope="col">Price</th>
                                <th scope="col">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for book in books %}

                            <tr>
                                <th scope="row">{{forloop.counter}}</th>
                                <td>{{book.title}}</td>
                                <td>{{book.type}}</td>
                                <td>{{book.price}} $</td>
                                <td>
                                    <a type="button" class="btn btn-primary"
                                        href="/edit-book?bookid={{book.id}}">Edit</a>
                                    <a type="button" class="btn btn-danger"
                                        href="/delete-book?bookid={{book.id}}">Delete</a>
                                </td>
                            </tr>

                            {% endfor %}
                        </tbody>
                    </table>
                </div>

                <div class="col-md-5 mt-0">
                    <h3>Book Types</h3>
                    <img src="{% url 'pie_chart' %}" alt="Pie chart"
                        style="width: 80%; margin-left: auto; margin-right: auto; display: block;">
                </div>
            </div>

        </div>



        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
            integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
            crossorigin="anonymous"></script>
    </body>

</html>
