<!doctype html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Registration</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    </head>

    <body>
        <div class="container-fluid">
            <div class="row justify-content-center mt-5">
                <div class="col-sm-6">
                    <h2 class="text-center">Registration</h2>
                    <form action="/register/" method="POST">
                        {% csrf_token %}
                        <div class="form-group mb-3">
                            <label for="{{ form.username.id_for_lable }}">Username: </label>
                            <input type="text" name="username" class="form-control" value="{{ form.username.value }}"
                                placeholder="Enter Username">
                            <span class="text-danger"><small> {{ form.username.errors }} </small></span>
                        </div>

                        <div class="form-group mb-3">
                            <label for="{{ form.password1.id_for_lable }}">Password: </label>
                            <input type="password" name="{{ form.password1.name }}" class="form-control"
                                placeholder="Enter Password">
                            <span class="text-danger"><small> {{ form.password1.errors }} </small></span>
                        </div>
                        <div class="form-group mb-3">
                            <label for="{{ form.password2.id_for_lable }}"> Confirm Password: </label>
                            <input type="password" name="password2" class="form-control" placeholder="Re-Type Password">
                            <span class="text-danger"><small> {{ form.password2.errors }} </small></span>
                        </div>

                        <button type="submit" class="btn btn-primary mt-3">Register</button>
                        <a href="/login/" type="submit" class="btn btn-dark mt-3">Login</a>

                    </form>
                </div>
            </div>
        </div>


        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
            integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
            crossorigin="anonymous"></script>
    </body>

</html>
