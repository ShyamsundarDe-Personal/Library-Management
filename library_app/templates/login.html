<!doctype html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Login</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    </head>

    <body>

        <div class="container-fluid">

            <div class="row justify-content-center mt-5">
                <div class="col-sm-6">
                    <h2 class="text-center">Login</h2>
    
                    {% if form.non_field_errors %}
                    <small class="text-danger">{{ form.non_field_errors }}</small>
                    {% endif %}
    
                    <form action="/login/" method="POST">
                        {% csrf_token %}
                        <div class="form-group mb-3">
                            <label for="{{ form.username.id_for_lable }}">Username: </label>
                            <input type="text" name="{{ form.username.name }}" class="form-control"
                                value="{{ form.username.value }}" placeholder="Enter Username">
                            <span class="text-danger"><small> {{ form.username.errors }} </small></span>
                        </div>
    
                        <div class="form-group mb-3">
                            <label for="{{ form.password.id_for_lable }}">Password: </label>
                            <input type="password" name="password" class="form-control" placeholder="Enter Password">
                            <span class="text-danger"><small> {{ form.password.errors }} </small></span>
                        </div>
    
                        <button type="submit" class="btn btn-primary mt-3">Login</button>
                        <a href="/register/" type="submit" class="btn btn-dark mt-3">Create New Account</a>
    
                    </form>
                </div>
            </div>
        </div>


        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
            integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
            crossorigin="anonymous"></script>
    </body>

</html>
